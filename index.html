<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Question For You</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFAF7;
    --cream-dark: #FDEFEA;
    --pink: #FF7FAE;
    --pink-deep: #E85D93;
    --lavender: #F2EBFB;
    --lavender-deep: #A594D1;
    --ink: #6B4463;
    --ink-soft: #B29AAB;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100%;
    overflow-x: hidden;
    position: relative;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .doodle { position: absolute; opacity: 0.6; animation: drift 9s ease-in-out infinite; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }
  @media (prefers-reduced-motion: reduce) { .doodle { animation: none; } }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    background: var(--card);
    border-radius: 26px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 44px rgba(107, 68, 99, 0.10);
    position: relative;
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  @media (max-width: 400px) {
    .card { padding: 32px 20px; border-radius: 22px; }
    .photo-frame { width: 104px; height: 104px; }
    h1 { font-size: 24px; }
    .food-grid { gap: 8px; }
  }

  .sound-toggle {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    z-index: 40;
    background: var(--card);
    color: var(--ink-soft);
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    padding: 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(107, 68, 99, 0.10);
  }

  .photo-frame {
    width: 128px;
    height: 128px;
    margin: 0 auto 22px;
    border-radius: 22px;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .photo-frame svg, .photo-frame .emoji-photo { width: auto; }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.35;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .sub { font-size: 15.5px; color: var(--ink-soft); margin: 6px 0 28px; line-height: 1.5; }

  .btn-stage {
    position: relative;
    height: 130px;
  }

  button {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  button:focus-visible { outline: 3px solid var(--lavender-deep); outline-offset: 3px; }

  .yes-btn {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--pink);
    color: white;
    box-shadow: 0 10px 22px rgba(255, 111, 160, 0.4);
    z-index: 3;
  }
  .yes-btn:hover { transform: translateX(-50%) scale(1.04); }
  .yes-btn:active { transform: translateX(-50%) scale(0.98); }

  .no-btn {
    position: absolute;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--lavender);
    color: var(--lavender-deep);
    font-size: 15px;
    padding: 12px 22px;
    z-index: 2;
  }

  .nudge { margin-top: 4px; font-size: 13px; color: var(--ink-soft); min-height: 18px; font-style: italic; }

  .hidden { display: none !important; }

  .confetti-piece {
    position: fixed;
    top: -20px;
    font-size: 16px;
    z-index: 60;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.9; } }

  .big-emoji { font-size: 52px; line-height: 1; }

  .continue-btn { background: var(--lavender-deep); color: white; width: 100%; margin-top: 8px; }
  .continue-btn:hover { transform: translateY(-2px); }

  .field-group { text-align: left; margin-bottom: 18px; }
  .field-label {
    display: block;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 7px;
  }
  .date-input, .time-select {
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid var(--cream-dark);
    background: var(--cream);
    color: var(--ink);
    min-height: 48px;
  }
  .date-input:focus, .time-select:focus { outline: none; border-color: var(--pink); }

  .error-text { color: var(--pink-deep); font-size: 13px; font-weight: 700; min-height: 18px; margin: 4px 0 0; }

  .primary-btn { background: var(--pink); color: white; width: 100%; box-shadow: 0 10px 22px rgba(255, 111, 160, 0.35); margin-top: 10px; }
  .primary-btn:hover { transform: translateY(-2px); }

  .back-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Nunito', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 10px 4px 0;
  }
  .back-link:hover { color: var(--pink-deep); }

  .food-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 4px;
  }
  .food-chip {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    background: var(--lavender);
    color: var(--lavender-deep);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 16px 4px 12px;
    min-height: 76px;
    cursor: pointer;
    transition: transform 0.14s ease, background 0.14s ease;
  }
  .food-chip .food-emoji { font-size: 24px; display: block; margin-bottom: 6px; }
  .food-chip:hover { transform: translateY(-2px); }
  .food-chip.picked { background: var(--pink); color: white; animation: pop 0.35s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 10px 22px rgba(255, 111, 160, 0.4); }
    50% { box-shadow: 0 10px 30px rgba(255, 111, 160, 0.75); }
  }
  .yes-btn { animation: pulseGlow 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .yes-btn, .food-chip.picked { animation: none; } }

  .notif-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    width: 100%;
    background: var(--lavender);
    color: var(--lavender-deep);
    border-radius: 16px;
    padding: 13px 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 4px;
    animation: notifPulse 1.8s ease-in-out infinite;
  }
  .notif-icon { font-size: 17px; }
  @keyframes notifPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .notif-bar.opened { animation: none; opacity: 0.7; }
  @media (prefers-reduced-motion: reduce) { .notif-bar { animation: none; } }

  .message-bubble {
    background: var(--cream-dark);
    border-radius: 16px;
    padding: 16px 18px;
    margin: 12px 0 4px;
    text-align: left;
    animation: cardIn 0.35s ease;
  }
  .typing-dots {
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    margin: 0;
    animation: typingBlink 1s ease-in-out infinite;
  }
  @keyframes typingBlink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .bubble-text {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 16.5px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0;
  }

  .confirm-detail {
    background: var(--cream-dark);
    border-radius: 16px;
    padding: 14px 18px;
    text-align: left;
    margin: 14px 0 18px;
  }
  .confirm-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 15px; }
  .confirm-row + .confirm-row { border-top: 1px solid rgba(165, 148, 209, 0.2); }
  .confirm-row span:first-child { color: var(--ink-soft); font-weight: 700; }
  .confirm-row span:last-child { color: var(--ink); font-weight: 700; text-align: right; }

  .emoji-photo { font-size: 62px; line-height: 1; display: inline-block; animation: bounce 2.4s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-4deg); }
  }
  @media (prefers-reduced-motion: reduce) { .emoji-photo { animation: none; } }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">🔊</button>

<div class="stage">

  <div class="card" id="screen-ask">
    <div class="photo-frame">
      <span class="emoji-photo">🐶</span>
    </div>
    <h1>🌸 Will you go on a date with me? 🌸</h1>
    <div class="btn-stage" id="btnStage">
      <button class="yes-btn" id="yesBtn">YES 💗</button>
      <button class="no-btn" id="noBtn">no... 🙈</button>
    </div>
    <p class="nudge" id="nudgeText">&nbsp;</p>
  </div>

  <div class="card hidden" id="screen-react">
    <div class="photo-frame"><span class="big-emoji">😭</span></div>
    <h1>WAIT YOU ACTUALLY SAID YES??</h1>
    <p class="sub">I was so ready for you to say no 🥺</p>
    <button class="continue-btn" id="reactBtn">Okay, okay! →</button>
  </div>

  <div class="card hidden" id="screen-date">
    <div class="photo-frame"><span class="big-emoji">📅</span></div>
    <h1>So... when are you free?</h1>
    <div class="field-group">
      <label class="field-label" for="dateInput">Pick a day ✨</label>
      <input class="date-input" type="date" id="dateInput">
    </div>
    <div class="field-group">
      <label class="field-label" for="timeSelect">What time? 🐾</label>
      <select class="time-select" id="timeSelect">
        <option value="" disabled selected>Select a time...</option>
        <option value="11:00 AM">11:00 AM — early bird special</option>
        <option value="12:00 PM">12:00 PM — lunch date sounds cute</option>
        <option value="1:00 PM">1:00 PM — brunch energy</option>
        <option value="2:00 PM">2:00 PM — afternoon stroll vibes</option>
        <option value="3:00 PM">3:00 PM — coffee o'clock</option>
        <option value="4:00 PM">4:00 PM — golden hour, just saying</option>
        <option value="5:00 PM">5:00 PM — pre-dinner butterflies</option>
        <option value="6:00 PM">6:00 PM — dinner time, let's go</option>
        <option value="7:00 PM">7:00 PM — now you're making me hungry</option>
        <option value="8:00 PM">8:00 PM — night owl mode</option>
      </select>
    </div>
    <p class="error-text" id="dateError">&nbsp;</p>
    <button class="primary-btn" id="dateNextBtn">Set the date! 💗</button>
  </div>

  <div class="card hidden" id="screen-food">
    <h1>What are we feeling? 🍜✨</h1>
    <div class="food-grid" id="foodGrid">
      <button type="button" class="food-chip" data-value="Pizza"><span class="food-emoji">🍕</span>Pizza</button>
      <button type="button" class="food-chip" data-value="Sushi"><span class="food-emoji">🍣</span>Sushi</button>
      <button type="button" class="food-chip" data-value="Burgers"><span class="food-emoji">🍔</span>Burgers</button>
      <button type="button" class="food-chip" data-value="Pasta"><span class="food-emoji">🍝</span>Pasta</button>
      <button type="button" class="food-chip" data-value="Tacos"><span class="food-emoji">🌮</span>Tacos</button>
      <button type="button" class="food-chip" data-value="Ramen"><span class="food-emoji">🍜</span>Ramen</button>
    </div>
    <p class="error-text" id="foodError">&nbsp;</p>
    <button class="primary-btn" id="foodNextBtn">Lock it in 💌</button>
    <button class="back-link" id="foodBackBtn">Back</button>
  </div>

  <div class="card hidden" id="screen-letter">
    <button class="notif-bar" id="notifBar">
      <span class="notif-icon">💬</span>
      <span>1 new message</span>
    </button>

    <div class="message-bubble hidden" id="messageBubble">
      <p class="typing-dots" id="typingDots">•••</p>
      <p class="bubble-text hidden" id="bubbleText"></p>
    </div>

    <div class="photo-frame" style="margin-top: 18px;">
      <span class="emoji-photo">🐶</span>
    </div>
    <h1>It's a date!</h1>

    <div class="confirm-detail">
      <div class="confirm-row"><span>Day</span><span id="confirmDate"></span></div>
      <div class="confirm-row"><span>Time</span><span id="confirmTime"></span></div>
      <div class="confirm-row"><span>Plan</span><span id="confirmFood"></span></div>
    </div>

    <button class="primary-btn" id="copyPlanBtn">📋 Copy the plan</button>
    <button class="continue-btn" id="textMeBtn">💬 Text me</button>
    <p class="error-text" id="copyHint">&nbsp;</p>
  </div>

</div>

<script>
(function () {
  var sky = document.getElementById('sky');
  var symbols = ['🌸', '💗', '🌸', '✨', '🌸'];
  var count = window.innerWidth < 480 ? 10 : 16;
  for (var i = 0; i < count; i++) {
    var d = document.createElement('div');
    d.className = 'doodle';
    d.textContent = symbols[i % symbols.length];
    d.style.left = Math.random() * 96 + 'vw';
    d.style.top = Math.random() * 92 + 'vh';
    d.style.fontSize = (14 + Math.random() * 14) + 'px';
    d.style.animationDelay = (Math.random() * 6) + 's';
    d.style.animationDuration = (7 + Math.random() * 5) + 's';
    sky.appendChild(d);
  }
})();

var soundKit = (function () {
  var ctx = null;
  var enabled = true;

  function getCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, start, duration, type, peakGain) {
    var c = getCtx();
    if (!c || !enabled) return;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, c.currentTime + start);
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(peakGain || 0.14, c.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + duration + 0.05);
  }

  return {
    setEnabled: function (v) { enabled = v; },
    isEnabled: function () { return enabled; },
    pop: function () { tone(720, 0, 0.12, 'sine', 0.12); },
    boing: function () { tone(320, 0, 0.1, 'triangle', 0.08); tone(260, 0.05, 0.12, 'triangle', 0.07); },
    click: function () { tone(500, 0, 0.08, 'square', 0.05); },
    chime: function () {
      tone(660, 0, 0.16, 'sine', 0.13);
      tone(880, 0.08, 0.18, 'sine', 0.12);
      tone(1046, 0.16, 0.22, 'sine', 0.11);
    },
    sparkle: function () {
      tone(988, 0, 0.14, 'sine', 0.09);
      tone(1318, 0.06, 0.16, 'sine', 0.09);
      tone(1568, 0.12, 0.2, 'sine', 0.08);
    }
  };
})();

(function () {
  var toggle = document.getElementById('soundToggle');
  toggle.addEventListener('click', function () {
    var next = !soundKit.isEnabled();
    soundKit.setEnabled(next);
    toggle.textContent = next ? '🔊' : '🔇';
  });
})();

function showScreen(id) {
  ['screen-ask', 'screen-react', 'screen-date', 'screen-food', 'screen-letter'].forEach(function (s) {
    document.getElementById(s).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function burstConfetti() {
  var symbols = ['🌸', '💗', '✨', '💌'];
  var n = 46;
  for (var i = 0; i < n; i++) {
    (function () {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      piece.style.left = Math.random() * 100 + 'vw';
      var duration = 2.2 + Math.random() * 1.6;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(piece);
      setTimeout(function () { piece.remove(); }, (duration + 0.5) * 1000);
    })();
  }
}

(function () {
  var noBtn = document.getElementById('noBtn');
  var btnStage = document.getElementById('btnStage');
  var nudgeText = document.getElementById('nudgeText');
  var dodgeCount = 0;
  var messages = [
    "Try again.",
    "Getting warmer... or colder?",
    "Come on, you know you want to.",
    "Nope, it dodged again.",
    "This button has trust issues.",
    "At this point just say yes."
  ];

  function dodge() {
    soundKit.boing();
    dodgeCount++;
    var stageRect = btnStage.getBoundingClientRect();
    var btnRect = noBtn.getBoundingClientRect();
    var maxX = stageRect.width - btnRect.width - 10;
    var maxY = stageRect.height - btnRect.height - 10;
    var x = 10 + Math.random() * Math.max(1, maxX - 10);
    var y = 10 + Math.random() * Math.max(1, maxY - 10);

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.transform = 'none';

    var scale = Math.max(0.55, 1 - dodgeCount * 0.06);
    noBtn.style.fontSize = (15 * scale) + 'px';

    nudgeText.textContent = messages[Math.min(dodgeCount - 1, messages.length - 1)];
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', function (e) { e.preventDefault(); dodge(); }, { passive: false });
  noBtn.addEventListener('click', function (e) { e.preventDefault(); dodge(); });
})();

document.getElementById('yesBtn').addEventListener('click', function () {
  soundKit.chime();
  burstConfetti();
  showScreen('screen-react');
});

document.getElementById('reactBtn').addEventListener('click', function () {
  soundKit.click();
  showScreen('screen-date');
  var dateInput = document.getElementById('dateInput');
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var dd = String(today.getDate()).padStart(2, '0');
  dateInput.min = yyyy + '-' + mm + '-' + dd;
});

(function () {
  var dateInput = document.getElementById('dateInput');
  var timeSelect = document.getElementById('timeSelect');
  var dateError = document.getElementById('dateError');

  dateInput.addEventListener('input', function () { dateError.textContent = '\u00A0'; });
  timeSelect.addEventListener('change', function () { dateError.textContent = '\u00A0'; });

  document.getElementById('dateNextBtn').addEventListener('click', function () {
    if (!dateInput.value) { dateError.textContent = 'Pick a day first.'; return; }
    if (!timeSelect.value) { dateError.textContent = 'Pick a time too.'; return; }
    soundKit.click();
    window.__selectedDate = dateInput.value;
    window.__selectedTime = timeSelect.value;
    showScreen('screen-food');
  });
})();

(function () {
  var chips = document.querySelectorAll('#foodGrid .food-chip');
  var selectedFood = null;
  var foodError = document.getElementById('foodError');

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      soundKit.pop();
      chips.forEach(function (c) { c.classList.remove('picked'); });
      chip.classList.add('picked');
      selectedFood = chip.dataset.value;
      foodError.textContent = '\u00A0';
    });
  });

  document.getElementById('foodBackBtn').addEventListener('click', function () {
    showScreen('screen-date');
  });

  function formatDate(value) {
    if (!value) return '';
    var parts = value.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  document.getElementById('foodNextBtn').addEventListener('click', function () {
    if (!selectedFood) { foodError.textContent = 'Pick one first.'; return; }

    var dateDisplay = formatDate(window.__selectedDate);
    var timeVal = window.__selectedTime;

    document.getElementById('confirmDate').textContent = dateDisplay;
    document.getElementById('confirmTime').textContent = timeVal;
    document.getElementById('confirmFood').textContent = selectedFood;

    var message = "It's a date! " + dateDisplay + " at " + timeVal + " — let's do " + selectedFood + ".";
    window.__planMessage = message;

    soundKit.sparkle();
    burstConfetti();
    showScreen('screen-letter');
  });
})();

(function () {
  var notifBar = document.getElementById('notifBar');
  var messageBubble = document.getElementById('messageBubble');
  var typingDots = document.getElementById('typingDots');
  var bubbleText = document.getElementById('bubbleText');
  var opened = false;

  var sweetMessage = "Hey!!! I'm really glad you said yes 🙈 Honestly, I haven't stopped thinking about you since that day... I can't wait to hear from you.";

  notifBar.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    soundKit.click();
    notifBar.classList.add('opened');
    notifBar.querySelector('span:last-child').textContent = 'Message opened';
    messageBubble.classList.remove('hidden');

    setTimeout(function () {
      soundKit.chime();
      typingDots.classList.add('hidden');
      bubbleText.textContent = sweetMessage;
      bubbleText.classList.remove('hidden');
    }, 900);
  });

  document.getElementById('copyPlanBtn').addEventListener('click', function () {
    var text = window.__planMessage || "It's a date!";
    var hint = document.getElementById('copyHint');
    soundKit.pop();
    try {
      navigator.clipboard.writeText(text).then(function () {
        hint.textContent = 'Copied! Paste it wherever you like.';
      }).catch(function () {
        hint.textContent = text;
      });
    } catch (e) {
      hint.textContent = text;
    }
  });

  document.getElementById('textMeBtn').addEventListener('click', function () {
    soundKit.click();
    var text = window.__planMessage || "It's a date!";
    var phoneNumber = '+12168946335';
    var smsUrl = 'sms:' + phoneNumber + '?body=' + encodeURIComponent(text);
    window.location.href = smsUrl;
  });
})();
</script>

</body>
</html>
